<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">AIRMO drone telemetry and ground station</title>
  <desc id="desc">Methane data enters the UAV, is transmitted over an RF telemetry link, and is received at the ground station for display.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#334147"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#89bccc"/></marker>
  </defs>
  <rect width="600" height="330" fill="#1b242d"/><rect width="600" height="330" fill="url(#dots)"/>
  <g fill="#1d2b34" stroke="#658594"><rect x="25" y="108" width="135" height="88" rx="4"/><rect x="185" y="108" width="135" height="88" rx="4"/><rect x="405" y="108" width="170" height="88" rx="4"/></g>
  <g stroke="#89bccc" fill="none" stroke-width="1.5" marker-end="url(#arrow)"><path d="M160 152H185"/><path d="M320 152H405" stroke-dasharray="5 4"/></g>
  <g font-family="Consolas, monospace" text-anchor="middle" fill="#c5dfef" font-size="13"><text x="92" y="141">METHANE DATA</text><text x="252" y="141">UAV</text><text x="490" y="141">GROUND STATION</text></g>
  <g font-family="Consolas, monospace" text-anchor="middle" fill="#a6b9ba" font-size="11"><text x="92" y="166">MEASUREMENTS</text><text x="252" y="166">RECEIVE + TRANSMIT</text><text x="490" y="166">RECEIVE + DISPLAY</text></g>
  <text x="362" y="95" text-anchor="middle" font-family="Consolas, monospace" fill="#a6b9ba" font-size="10">RF TELEMETRY</text>
  <g fill="none" stroke="#658594"><path d="M40 225H305V260H40Z"/><path d="M420 225H565V260H420Z"/></g>
  <g font-family="Consolas, monospace" text-anchor="middle" fill="#a6b9ba" font-size="10"><text x="172" y="247">AIRBORNE / DATA ACQUISITION</text><text x="492" y="247">GROUND / LIVE DATA</text></g>
  <g font-family="Consolas, monospace" font-size="10" fill="#a6b9ba" letter-spacing="1"><text x="25" y="30">02 / AIRMO TELEMETRY</text><text x="25" y="310">METHANE MEASUREMENTS TO A GROUND-STATION DISPLAY</text></g>
</svg>
