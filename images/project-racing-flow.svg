<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">BYU Racing live telemetry and analysis</title>
  <desc id="desc">Car CAN and GPS data enter a Raspberry Pi. LTE sends data over WebSocket to FastAPI. React displays live data; PostgreSQL stores data for analysis. An RTK base station supplies GPS corrections to the Pi.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#334147"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#78dccc"/></marker>
  </defs>
  <rect width="600" height="330" fill="#182426"/><rect width="600" height="330" fill="url(#dots)"/>
  <g fill="#192c2b" stroke="#547770">
    <rect x="20" y="105" width="105" height="78" rx="4"/><rect x="158" y="105" width="118" height="78" rx="4"/>
    <rect x="316" y="105" width="118" height="78" rx="4"/><rect x="474" y="105" width="106" height="78" rx="4"/>
    <rect x="316" y="235" width="118" height="58" rx="4"/><rect x="153" y="235" width="128" height="58" rx="4"/>
  </g>
  <g stroke="#78dccc" fill="none" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M125 144H158"/><path d="M276 144H316"/><path d="M434 144H474"/>
    <path d="M375 183V235"/><path d="M434 264H527V183"/><path d="M217 235V183" stroke-dasharray="4 4"/>
  </g>
  <g font-family="Consolas, monospace" text-anchor="middle" fill="#e0eeea" font-size="13">
    <text x="73" y="136">CAR DATA</text><text x="217" y="136">RASPBERRY PI</text><text x="375" y="136">FASTAPI</text><text x="527" y="136">REACT</text>
    <text x="375" y="261">POSTGRESQL</text><text x="217" y="259">RTK BASE</text>
  </g>
  <g font-family="Consolas, monospace" text-anchor="middle" fill="#a6b9ba" font-size="10">
    <text x="73" y="160">CAN + GPS</text><text x="217" y="160">CAN HAT + LTE</text><text x="375" y="160">CANDB CONVERSION</text><text x="527" y="160">LIVE DASHBOARD</text>
    <text x="375" y="279">SAVED DATA</text><text x="217" y="279">GPS CORRECTIONS</text>
    <text x="296" y="88">LTE / WEBSOCKET</text><text x="456" y="204">LIVE</text><text x="528" y="285">ANALYSIS</text>
  </g>
  <g font-family="Consolas, monospace" font-size="10" fill="#a6b9ba" letter-spacing="1"><text x="20" y="30">01 / BYU RACING TELEMETRY</text><text x="20" y="315">ACQUIRE / STREAM / STORE / ANALYZE</text></g>
</svg>
